<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OhayoDev Sprint Retrospective</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link href="retro.css" rel="stylesheet" />
    <script src="/socket.io/socket.io.js"></script>
  </head>
  <body>
    <div id="loading-overlay" class="loading-overlay">
      Connecting to session...
    </div>

    <nav class="app-header fixed top-0 left-0 right-0 z-50">
      <div class="max-w-screen-2xl mx-auto px-4">
        <div class="flex justify-between h-16 items-center gap-3">
          <div class="flex items-center gap-3 min-w-0">
            <span class="text-lg sm:text-xl font-bold whitespace-nowrap">
              OhayoDev
            </span>
            <nav class="nav-tabs" aria-label="Tools">
              <a id="nav-pointing" href="/" class="nav-tab">
                <span class="material-icons">style</span>
                <span class="nav-label">Pointing</span>
              </a>
              <a href="/retro.html" class="nav-tab active" aria-current="page">
                <span class="material-icons">dashboard</span>
                <span class="nav-label">Retro</span>
              </a>
            </nav>
            <div class="room-info">
              <span class="text-sm opacity-80 hidden sm:inline">Room</span>
              <code id="room-id-display" class="text-sm font-mono text-purple-300"></code>
              <button
                type="button"
                id="copy-link-btn"
                onclick="copyRoomLink()"
                class="icon-btn"
                title="Copy room link"
                aria-label="Copy room link"
              >
                <span class="material-icons">link</span>
              </button>
            </div>
          </div>

          <div class="flex items-center gap-3 min-w-0">
            <div id="participants-list" class="text-sm opacity-80 truncate hidden lg:block"></div>
            <span id="user-name" class="opacity-80 whitespace-nowrap hidden sm:inline"></span>
          </div>
        </div>
      </div>
    </nav>

    <main class="retro-main">
      <div class="glass retro-toolbar">
        <h1 class="text-xl font-bold whitespace-nowrap">Sprint Retrospective</h1>
        <div class="flex items-center gap-3 min-w-0">
          <span class="text-sm text-gray-300 hidden md:inline whitespace-nowrap">Drag a sticky onto the board</span>
          <div id="sticky-pad" class="flex gap-2" role="group" aria-label="Sticky note colors"></div>
        </div>
        <div id="timer-display" class="text-2xl font-bold hidden"></div>
        <div class="flex flex-wrap gap-2 ml-auto">
          <button type="button" onclick="resetRetro()" class="md-btn md-btn-ghost px-3 py-2">
            <span class="material-icons">refresh</span>
            <span class="hidden sm:inline">Reset</span>
          </button>
          <button type="button" onclick="toggleTimer()" id="timer-btn" class="md-btn md-btn-ghost px-3 py-2">
            <span class="material-icons">timer</span>
            <span class="hidden sm:inline">Start Timer (5:00)</span>
          </button>
          <button type="button" onclick="groupSimilarCards()" class="md-btn md-btn-primary px-3 py-2">
            <span class="material-icons">group_work</span>
            <span class="hidden sm:inline">Group Similar</span>
          </button>
        </div>
      </div>

      <div id="board-viewport" class="board-viewport glass" aria-label="Retro board. Scroll to zoom, drag empty space to pan.">
        <div id="board-world" class="board-world">
          <div id="board" class="board-columns"></div>
          <div id="items-layer" class="items-layer"></div>
        </div>
        <div class="zoom-controls" role="group" aria-label="Zoom">
          <button type="button" class="icon-btn" onclick="zoomBy(1 / 1.25)" title="Zoom out (-)" aria-label="Zoom out">
            <span class="material-icons">remove</span>
          </button>
          <button type="button" id="zoom-level" class="zoom-level" onclick="setZoom(1)" title="Reset to 100% (1)">100%</button>
          <button type="button" class="icon-btn" onclick="zoomBy(1.25)" title="Zoom in (+)" aria-label="Zoom in">
            <span class="material-icons">add</span>
          </button>
          <button type="button" class="icon-btn" onclick="fitBoard()" title="Fit the board (0)" aria-label="Fit the board">
            <span class="material-icons">fit_screen</span>
          </button>
        </div>
        <div class="board-hint">Scroll to zoom · drag empty space to pan · drop images or stickies anywhere</div>
      </div>
    </main>

    <input type="file" id="image-input" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden" multiple />
    <input type="file" id="header-image-input" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden" />

    <div id="sketch-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="sketch-title">
      <div class="modal p-4 sm:p-6">
        <div class="flex justify-between items-center mb-4">
          <h2 id="sketch-title" class="text-xl font-bold">✏️ Sketch something</h2>
          <button type="button" class="icon-btn" onclick="closeSketch()" aria-label="Close sketch pad">
            <span class="material-icons">close</span>
          </button>
        </div>
        <div class="flex flex-wrap items-center gap-3 mb-3">
          <div id="sketch-colors" class="flex gap-2" role="group" aria-label="Pen color"></div>
          <div id="sketch-sizes" class="flex gap-2" role="group" aria-label="Pen size"></div>
          <button type="button" id="sketch-eraser" class="md-btn md-btn-ghost px-3 py-1" onclick="toggleEraser()">
            <span class="material-icons">auto_fix_normal</span>Eraser
          </button>
          <button type="button" class="md-btn md-btn-ghost px-3 py-1" onclick="undoStroke()">
            <span class="material-icons">undo</span>Undo
          </button>
          <button type="button" class="md-btn md-btn-ghost px-3 py-1" onclick="clearSketch()">
            <span class="material-icons">delete_sweep</span>Clear
          </button>
        </div>
        <canvas id="sketch-canvas" width="800" height="500" aria-label="Drawing area"></canvas>
        <div class="flex flex-wrap justify-between items-center gap-3 mt-4">
          <label class="text-sm text-gray-300 flex items-center gap-2">
            Add to
            <select id="sketch-column" class="bg-gray-800 rounded px-2 py-1"></select>
          </label>
          <div class="flex gap-2">
            <button type="button" class="md-btn md-btn-ghost px-4 py-2" onclick="closeSketch()">Cancel</button>
            <button type="button" id="sketch-save" class="md-btn md-btn-primary px-4 py-2" onclick="saveSketch()">
              <span class="material-icons">push_pin</span>Pin to board
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script src="retro.js"></script>
  </body>
</html>
