<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OhayoDev Agile Pointing</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  </head>
  <body>
    <nav class="app-header fixed top-0 left-0 right-0 z-50">
      <div class="max-w-7xl mx-auto px-4">
        <div class="flex justify-between h-16 items-center gap-3">
          <div class="flex items-center gap-3 min-w-0">
            <span class="text-lg sm:text-xl font-bold whitespace-nowrap">
              🃏 OhayoDev<span class="hidden sm:inline"> Agile Pointing</span>
            </span>
            <div id="header-room-info" class="room-info hidden">
              <span class="text-sm text-gray-300 hidden sm:inline">Room</span>
              <code id="header-room-id" class="text-sm font-mono"></code>
              <button
                type="button"
                class="icon-btn copy-button"
                onclick="copyRoomLink()"
                title="Copy room link"
                aria-label="Copy room link"
              >
                <span class="material-icons text-base">link</span>
              </button>
            </div>
          </div>
          <div class="flex items-center gap-1 sm:gap-2 flex-shrink-0">
            <button
              type="button"
              id="sound-toggle"
              class="icon-btn"
              onclick="toggleSound()"
              title="Mute sounds"
              aria-label="Mute sounds"
            >
              <span class="material-icons">volume_up</span>
            </button>
            <a href="/retro.html" class="icon-btn" title="Sprint retro" aria-label="Sprint retro">
              <span class="material-icons">dashboard</span>
            </a>
            <button
              type="button"
              id="leave-btn"
              onclick="leaveRoom()"
              class="md-btn md-btn-danger px-3 py-2 hidden"
            >
              <span class="material-icons">logout</span>
              <span class="hidden sm:inline">Leave</span>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main class="min-h-screen pt-24 pb-28 px-4">
      <div
        id="access-form"
        class="modern-card p-8 max-w-md mx-auto mt-16"
        style="display: none"
      >
        <h2 class="gradient-text text-3xl font-bold mb-6 text-center float-animation">
          Enter Access Code
        </h2>
        <div class="mb-6">
          <label for="access-code-input" class="sr-only">Access code</label>
          <input
            type="password"
            id="access-code-input"
            class="text-input"
            placeholder="Enter access code"
            autocomplete="off"
          />
        </div>
        <button
          type="button"
          onclick="submitAccessCode()"
          class="md-btn md-btn-primary w-full p-3"
        >
          <span class="material-icons">lock_open</span>
          Submit
        </button>
      </div>

      <div id="main-content" style="display: none">
        <!-- Join Form -->
        <div id="join-form" class="modern-card p-6 sm:p-8 max-w-md mx-auto">
          <h2 class="gradient-text text-3xl font-bold mb-6 text-center pulse-animation">
            Join Agile Pointing
          </h2>
          <div class="space-y-4 mb-6">
            <div>
              <label for="name" class="sr-only">Your name</label>
              <input
                type="text"
                id="name"
                maxlength="40"
                placeholder="Your name"
                class="text-input"
                autocomplete="nickname"
              />
            </div>
            <div>
              <label for="room" class="sr-only">Room ID</label>
              <input
                type="text"
                id="room"
                maxlength="64"
                placeholder="Room ID (leave blank for a new room)"
                class="text-input"
              />
            </div>
          </div>

          <p class="mb-3 text-lg font-medium gradient-text">Choose your avatar</p>
          <div class="flex gap-2 mb-4" role="tablist" aria-label="Avatar type">
            <button type="button" onclick="switchAvatarMode('emoji')" class="avatar-mode-btn" data-mode="emoji" role="tab">Emoji</button>
            <button type="button" onclick="switchAvatarMode('dicebear')" class="avatar-mode-btn" data-mode="dicebear" role="tab">Generated</button>
            <button type="button" onclick="switchAvatarMode('custom')" class="avatar-mode-btn" data-mode="custom" role="tab">Custom</button>
          </div>

          <div class="avatar-section" data-section="emoji">
            <label for="emoji-search" class="sr-only">Search emojis</label>
            <input
              type="search"
              id="emoji-search"
              class="text-input mb-3"
              placeholder="Search emojis (fox, pizza, rocket…)"
            />
            <div id="emoji-tabs" class="emoji-tabs" role="tablist" aria-label="Emoji categories"></div>
            <div id="emoji-grid" class="emoji-grid" role="listbox" aria-label="Emojis"></div>
          </div>

          <div class="hidden avatar-section" data-section="dicebear">
            <label for="avatar-style" class="block text-sm font-medium text-gray-300 mb-2">Style</label>
            <select id="avatar-style" class="text-input mb-3" onchange="regenerateAvatar()">
              <option value="avataaars">Human</option>
              <option value="bottts">Robot</option>
              <option value="pixel-art">Pixel Art</option>
              <option value="fun-emoji">Fun Emoji</option>
              <option value="identicon">Abstract</option>
            </select>
            <button type="button" onclick="regenerateAvatar()" class="md-btn md-btn-ghost px-4 py-2 w-full mb-3">
              <span class="material-icons">casino</span>Roll a new one
            </button>
            <div class="w-24 h-24 mx-auto bg-gray-800 rounded-2xl overflow-hidden">
              <img id="dicebear-image" class="w-full h-full object-cover" alt="Generated avatar" />
            </div>
          </div>

          <div class="hidden avatar-section" data-section="custom">
            <input type="file" id="avatar-upload" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden" />
            <button type="button" onclick="document.getElementById('avatar-upload').click()" class="md-btn md-btn-ghost px-4 py-2 w-full mb-3">
              <span class="material-icons">upload</span>Upload image
            </button>
            <div id="custom-preview" class="w-24 h-24 mx-auto bg-gray-800 rounded-2xl overflow-hidden hidden">
              <img id="custom-image" class="w-full h-full object-cover" alt="Custom avatar" />
            </div>
          </div>

          <button
            type="button"
            onclick="joinRoom()"
            class="md-btn md-btn-primary w-full p-3 mt-6 text-lg"
          >
            <span class="material-icons">group_add</span>
            Join Room
          </button>
        </div>

        <!-- Voting Area -->
        <div id="voting-area" class="hidden max-w-6xl mx-auto space-y-6">
          <section class="modern-card p-4 sm:p-6">
            <div class="flex flex-col sm:flex-row gap-3 mb-5">
              <div class="flex-1">
                <label for="story-input" class="sr-only">Story being estimated</label>
                <input
                  type="text"
                  id="story-input"
                  maxlength="140"
                  class="text-input"
                  placeholder="What are we estimating? (optional, everyone sees this)"
                />
              </div>
              <div class="sm:w-40">
                <label for="deck-select" class="sr-only">Card deck</label>
                <select id="deck-select" class="text-input" onchange="changeDeck(this.value)">
                  <option value="fibonacci">Fibonacci</option>
                  <option value="tshirt">T-shirt sizes</option>
                </select>
              </div>
            </div>

            <div
              id="voting-buttons"
              class="flex justify-center flex-wrap gap-3 mb-6"
              role="group"
              aria-label="Your estimate"
            ></div>

            <div class="max-w-md mx-auto mb-5">
              <div class="flex justify-between text-sm text-gray-300 mb-2">
                <span id="vote-progress-text" aria-live="polite"></span>
                <span id="streak-badge" class="streak-badge hidden"></span>
              </div>
              <div class="progress-track">
                <div id="vote-progress-bar" class="progress-bar"></div>
              </div>
            </div>

            <div class="flex flex-wrap justify-center gap-3">
              <button type="button" id="reveal-btn" class="md-btn md-btn-primary" onclick="onRevealButton()">
                <span class="material-icons">visibility</span>
                <span class="label">Reveal votes</span>
              </button>
              <button type="button" id="reset-btn" class="md-btn md-btn-ghost px-4 py-2" onclick="resetVotes()">
                <span class="material-icons">restart_alt</span>
                Clear votes
              </button>
            </div>
          </section>

          <section id="results" class="results-panel modern-card p-6 hidden" aria-live="polite">
            <div id="consensus" class="rainbow-text text-4xl sm:text-5xl text-center mb-4 hidden">
              CONSENSUS! 🎉
            </div>
            <div class="grid md:grid-cols-2 gap-6 items-center">
              <div class="space-y-4">
                <div class="flex items-center gap-6 flex-wrap">
                  <div class="suggested-chip">
                    <span class="text-xs uppercase tracking-wider text-gray-300">Suggested</span>
                    <span id="suggested-vote" class="value gradient-text"></span>
                  </div>
                  <div id="average-wrap">
                    <div class="text-xs uppercase tracking-wider text-gray-400">Average</div>
                    <div id="average-vote" class="text-3xl font-bold"></div>
                  </div>
                </div>
                <div id="vote-chart" class="space-y-2"></div>
                <p id="vote-breakdown" class="text-sm text-gray-400"></p>
                <div id="results-callout" class="callout hidden"></div>
              </div>
              <div class="flex justify-center">
                <img id="giphy-image" class="hidden shadow-2xl" alt="" />
              </div>
            </div>
          </section>

          <section>
            <div
              id="participants"
              class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"
            ></div>
          </section>

          <details id="history" class="modern-card p-4 sm:p-6">
            <summary class="cursor-pointer font-semibold flex items-center gap-2">
              <span class="material-icons">history</span>
              Round history <span id="history-count" class="text-gray-400 font-normal"></span>
            </summary>
            <div class="mt-4">
              <div id="history-list"></div>
              <p id="history-empty" class="text-gray-400 text-sm">
                Finished rounds show up here when you click “Next story”.
              </p>
              <button type="button" id="copy-history-btn" class="md-btn md-btn-ghost px-4 py-2 mt-4 hidden" onclick="copyHistory()">
                <span class="material-icons">content_copy</span>
                Copy as text
              </button>
            </div>
          </details>
        </div>
      </div>
    </main>

    <div id="reaction-bar" class="reaction-bar hidden" role="group" aria-label="Send a reaction"></div>
    <div id="reaction-layer" class="reaction-layer" aria-hidden="true"></div>
    <div id="countdown-overlay" class="countdown-overlay hidden" aria-live="assertive"></div>
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script src="access.js"></script>
    <script src="emoji-data.js"></script>
    <script src="sounds.js"></script>
    <script src="pointing.js"></script>
  </body>
</html>
